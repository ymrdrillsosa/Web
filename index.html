<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emir Kaş</title>
<style>
  :root {
    --bg: #0b0a0f;
    --gold: #e8b84a;
    --green: #3fd18a;
    --text: #ece6d8;
    --muted: #9a93a6;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background:
      radial-gradient(ellipse at 50% 30%, rgba(232,184,74,0.14), transparent 60%),
      radial-gradient(ellipse at 50% 100%, rgba(63,209,138,0.10), transparent 55%),
      var(--bg);
    color: var(--text);
    font-family: Georgia, "Times New Roman", serif;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 56px 20px 24px;
    text-align: center;
  }
  h1 {
    font-size: clamp(2.6rem, 8vw, 5rem);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--gold);
    text-shadow: 0 0 24px rgba(232,184,74,0.35);
    animation: rise 1s ease both;
  }
  .title {
    margin-top: 12px;
    font-size: clamp(1rem, 2.6vw, 1.4rem);
    font-style: italic;
    color: var(--muted);
    letter-spacing: 0.06em;
    animation: rise 1s 0.15s ease both;
  }
  .divider {
    width: 120px;
    height: 2px;
    margin: 28px auto;
    background: linear-gradient(90deg, transparent, var(--green), transparent);
  }
  .portrait {
    position: relative;
    animation: rise 1s 0.3s ease both;
  }
  .portrait::before {
    content: "";
    position: absolute;
    inset: 8% -30%;
    background: radial-gradient(closest-side, rgba(232,184,74,0.25), transparent);
    filter: blur(20px);
    z-index: 0;
  }
  .portrait img {
    position: relative;
    z-index: 1;
    display: block;
    height: min(70vh, 640px);
    width: auto;
    max-width: 100%;
    filter: drop-shadow(0 18px 30px rgba(0,0,0,0.7));
    animation: float 6s ease-in-out infinite;
  }
  footer {
    padding: 22px 20px 28px;
    text-align: center;
    font-size: 0.85rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    border-top: 1px solid rgba(255,255,255,0.06);
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-10px); }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; }
  }
</style>
</head>
<body>
  <main>
    <h1>Emir Kaş</h1>
    <p class="title">fulltime endurer and professional philosopher</p>
    <div class="divider"></div>
    <div class="portrait">
      <img src="image.png" alt="Portrait of Emir Kaş">
    </div>
  </main>
  <footer>&copy; All rights reserved</footer>
</body>
</html>
